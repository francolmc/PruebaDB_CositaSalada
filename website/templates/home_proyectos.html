<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proyectos</title>
</head>
<body>
    <h1>Lista de proyectos</h1>
    <form method="get">
        <input type="text" name="q" value="{{ q }}" placeholder="Buscar proyecto" />
        <button type="submit">Buscar 🔍</button>
    </form>
    <a href="{% url 'crear_proyecto' %}">Nuevo Proyecto</a>
    <ul>
        {% for proyecto in proyectos %}
            <li>
                {{ proyecto.titulo }}
                {% if proyecto.usuario == user %}
                <a href="{% url 'editar_proyecto' proyecto.pk %}">Editar</a>
                <a href="{% url 'eliminar_proyecto' proyecto.pk %}">Eliminar</a>
                {% endif %}
            </li>
        {% empty %}
        <li>No se encontraron proyectos relacionados.</li>
        {% endfor %}
    </ul>
</body>
</html>
