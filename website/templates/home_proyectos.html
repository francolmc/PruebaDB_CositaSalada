<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proyectos</title>
</head>
<body>
    <h1>Lista de proyectos</h1>
    <ul>
        {% for proyecto in proyectos %}
            <li>
                {{ proyecto.titulo }}
                <a href="{% url 'editar_proyecto' proyecto.pk %}">Editar</a>
                <a href="{% url 'eliminar_proyecto' proyecto.pk %}">Eliminar</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
